# Publishes the `noteral-app` npm package (packaging/npm). The release
# workflow starts this after every version tag; you can also run it by hand.
# The GitHub release matching packaging/npm/package.json's version must exist.
#
# Uses npm trusted publishing (OIDC): no token. On npmjs.com, noteral-app's
# trusted publisher is GitHub Actions, neurh/Noteral, workflow npm-publish.yml.
name: Publish npm
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Trusted publishing needs npm 11.5.1+, which ships with Node 24.
      - uses: actions/setup-node@v5
        with: { node-version: "24", registry-url: "https://registry.npmjs.org" }
      - name: Check the release exists
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          npm --version
          v=$(node -p "require('./packaging/npm/package.json').version")
          n=$(node -p "require('./packaging/npm/package.json').name")
          gh release view "v$v" >/dev/null || { echo "::error::No GitHub release v$v"; exit 1; }
          if npm view "$n@$v" version >/dev/null 2>&1; then echo "::notice::$n@$v is already on npm"; echo "skip=1" >> "$GITHUB_ENV"; fi
      - name: Publish
        if: env.skip != '1'
        working-directory: packaging/npm
        run: npm publish --provenance --access public
