# Checks every push and pull request: frontend types and tests, Go tests, and
# the install scripts.
name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx tsc --noEmit
      - working-directory: frontend
        run: npm test

  go:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod, cache: true }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: go vet
        run: go vet -tags gtk3 ./internal/...
      - name: go test
        run: go test -tags gtk3 ./internal/...

  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: No file names that clash on macOS or Windows
        run: |
          dupes=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "::error::These paths differ only in case: $dupes"; exit 1; fi
      - name: shellcheck install.sh
        run: shellcheck -s sh scripts/install/install.sh
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/install/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: npm launcher
        run: node --check packaging/npm/bin/noteral.js && node packaging/npm/bin/noteral.js --version

  # The npm launcher downloads the release matching packaging/npm/package.json.
  npm-launcher:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22" }
      - name: Download and unpack the release
        shell: bash
        run: |
          v=$(node -p "require('./packaging/npm/package.json').version")
          if ! gh release view "v$v" >/dev/null 2>&1; then echo "No v$v release yet, skipping."; exit 0; fi
          p=$(node packaging/npm/bin/noteral.js --path)
          echo "$p"; test -e "$p"
        env:
          GH_TOKEN: ${{ github.token }}
          NOTERAL_CACHE_DIR: ${{ runner.temp }}/noteral-npm
