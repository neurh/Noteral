# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "noteral"
arch: ${GOARCH}
platform: "linux"
version: "0.1.1"
section: "default"
priority: "extra"
maintainer: "Noteral <noreply@github.com>"
description: "A quiet, local-first notes app for the desktop"
vendor: "Noteral"
homepage: "https://github.com/neurh/Noteral"
license: "MIT"
release: "1"

contents:
  - src: "./bin/noteral"
    dst: "/usr/local/bin/noteral"
  - src: "./build/appicon.png"
    dst: "/usr/share/pixmaps/noteral.png"
  - src: "./LICENSE"
    dst: "/usr/share/doc/noteral/copyright"
  - src: "./build/linux/noteral.desktop"
    dst: "/usr/share/applications/noteral.desktop"

# Noteral builds with -tags gtk3 (GTK 3 + WebKitGTK 4.1), which ships on
# Ubuntu 22.04+, Debian 12+, Fedora, openSUSE and Arch.
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk3
      - webkit2gtk4.1

  # Arch Linux packages
  archlinux:
    depends:
      - gtk3
      - webkit2gtk-4.1

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"
